[package]
name = "geoscribe"
version = "0.3.0"
edition = "2024"
description = "Embedded CRS registry: an authoritative (authority, code) -> PROJJSON/WKT lookup, derived from PROJ/proj.db. The Rust glue is MIT; the embedded data carries third-party dataset terms — see NOTICE."
license = "MIT"

# Decoding (zstd) and lookup live here (R6, see public-api.org), behind a
# real public API (`resolve`/`resolve_by_name`/`all`) — no external
# dependencies, just this crate's own ported zstd decoder.
[dependencies]

[lib]
name = "geoscribe"
path = "src/lib.rs"

[[bin]]
name = "geoscribe"
path = "src/main.rs"
