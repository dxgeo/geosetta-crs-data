[package]
name = "geoscribe"
version = "0.4.0"
edition = "2024"
description = "Geospatial metadata reader/writer: an embedded, authoritative CRS registry (all 13,790 CRSes in PROJ's proj.db) — resolve (authority, code) to PROJJSON/WKT1/WKT2, or identify an id-less WKT by name validated against its own ellipsoid, reporting ambiguity rather than guessing. Zero dependencies; library + CLI. Rust code is MIT; the embedded CRS data carries third-party dataset terms — see NOTICE."
license = "MIT"

# Decoding (zstd) and lookup live here (R6, see plans/public-api.org), behind a
# real public API (`resolve`/`resolve_by_name`/`all`) — no external
# dependencies, just this crate's own ported zstd decoder.
[dependencies]

[lib]
name = "geoscribe"
path = "src/lib.rs"

[[bin]]
name = "geoscribe"
path = "src/main.rs"
